<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./favicon.png">
    <title>工具 | tools | Qcy's Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animate-gradient {
            background: linear-gradient(-45deg, #0f172a, #1e293b, #312e81, #1e1b4b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 10px 40px -10px rgba(99, 102, 241, 0.3);
        }

        .btn-glow {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .btn-glow::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.3s, transform 0.3s;
        }

        .btn-glow:hover::after {
            opacity: 1;
            transform: scale(1);
        }

        ::selection { background-color: #6366f1; color: white; }

        .tool-tag {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 9999px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .tool-tag:hover {
            background: rgba(99, 102, 241, 0.4);
            color: white;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
    </style>
</head>
<body class="animate-gradient font-sans text-gray-300 selection:bg-indigo-500 selection:text-white">

    <nav class="fixed top-0 left-0 w-full z-50 glass-panel px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="window.scrollTo({top:0, behavior:'smooth'})">
            <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i class="fa-solid fa-toolbox text-white text-lg"></i>
            </div>
            <span class="text-white font-bold text-xl tracking-wide">工具 | tools</span>
        </div>
        <a href="https://www.qcyblog.dpdns.org" class="btn-animate bg-white/20 hover:bg-white/30 text-white px-6 py-2 rounded-full font-medium border border-white/30 transition-colors flex items-center gap-2">
            <i class="fa-solid fa-house"></i>
            返回主站
        </a>
    </nav>

    <main class="container mx-auto px-4 pt-28 pb-12 relative z-10">
        
        <div class="text-center mb-12 max-w-3xl mx-auto">
            <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-4 drop-shadow-lg tracking-tight">
                Qcy整理的常用工具
            </h1>
            <p class="text-indigo-200 text-lg mb-8 font-light">
                好用的工具，提升你的体验
            </p>
            
            <div class="relative group">
                <div class="absolute -inset-1 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-xl blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
                <div class="relative flex items-center bg-slate-800/80 backdrop-blur-xl rounded-xl border border-white/10 shadow-2xl">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 text-gray-400"></i>
                    <input type="text" id="searchInput" placeholder="搜索工具名称、功能或标签..." 
                        class="w-full bg-transparent border-none focus:ring-0 text-white placeholder-gray-500 py-4 pl-12 pr-4 text-base outline-none">
                </div>
            </div>
        </div>

        <div class="flex justify-center flex-wrap gap-2 mb-10" id="categoryFilters">
            <button class="filter-btn active px-4 py-1.5 rounded-full bg-indigo-600 text-white text-sm font-semibold shadow-md shadow-indigo-600/20 transition-all" data-category="all">全部</button>
            <button class="filter-btn px-4 py-1.5 rounded-full bg-slate-800/50 text-gray-400 border border-white/5 hover:bg-slate-700 hover:text-white text-sm transition-all" data-category="editor">编辑器</button>
            <button class="filter-btn px-4 py-1.5 rounded-full bg-slate-800/50 text-gray-400 border border-white/5 hover:bg-slate-700 hover:text-white text-sm transition-all" data-category="api">API测试</button>
            <button class="filter-btn px-4 py-1.5 rounded-full bg-slate-800/50 text-gray-400 border border-white/5 hover:bg-slate-700 hover:text-white text-sm transition-all" data-category="design">设计资源</button>
            <button class="filter-btn px-4 py-1.5 rounded-full bg-slate-800/50 text-gray-400 border border-white/5 hover:bg-slate-700 hover:text-white text-sm transition-all" data-category="deploy">部署运维</button>
        </div>

        <div id="toolList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 justify-items-start">
        </div>

        <div id="emptyState" class="hidden text-center py-12">
            <div class="inline-block p-4 rounded-full bg-slate-800/50 mb-4">
                <i class="fa-solid fa-box-open text-4xl text-gray-500"></i>
            </div>
            <p class="text-gray-400 text-lg">未找到相关工具</p>
            <p class="text-gray-600 text-sm mt-2">尝试更换关键词或清除筛选条件</p>
        </div>
    </main>

    <footer class="border-t border-white/5 bg-slate-900/50 backdrop-blur-sm py-8 text-center relative z-10 mt-12">
        <p class="text-gray-500 text-xs">&copy; 2026 DevToolkit. All rights reserved.</p>
    </footer>

    <script>
        const tools = [
            { id: 1, name: "VS Code", desc: "微软推出的轻量级但功能强大的源代码编辑器。", category: "editor", tags: ["Editor", "Microsoft"], icon: "fa-code", color: "text-blue-400", url: "#" },
            { id: 2, name: "Postman", desc: "API 开发协作平台，简化 API 构建流程。", category: "api", tags: ["API", "Testing"], icon: "fa-rocket", color: "text-orange-400", url: "#" },
            { id: 3, name: "Figma", desc: "基于浏览器的协作界面设计工具。", category: "design", tags: ["UI/UX", "Design"], icon: "fa-pen-nib", color: "text-purple-400", url: "#" },
            { id: 4, name: "Docker", desc: "用于开发、运输和运行应用程序的开放平台。", category: "deploy", tags: ["Container", "DevOps"], icon: "fa-docker", color: "text-blue-500", url: "#" },
            { id: 5, name: "GitHub Copilot", desc: "AI 结对程序员，帮助你更快地编写代码。", category: "editor", tags: ["AI", "Extension"], icon: "fa-robot", color: "text-gray-200", url: "#" },
            { id: 6, name: "Insomnia", desc: "开源、跨平台的 API 客户端，支持 GraphQL。", category: "api", tags: ["API", "GraphQL"], icon: "fa-bed", color: "text-pink-400", url: "#" },
            { id: 7, name: "Tailwind CSS", desc: "实用优先的 CSS 框架，快速构建现代网站。", category: "design", tags: ["CSS", "Framework"], icon: "fa-wind", color: "text-cyan-400", url: "#" },
            { id: 8, name: "Vercel", desc: "前端开发人员平台，用于静态站点和 Serverless 函数。", category: "deploy", tags: ["Hosting", "Serverless"], icon: "fa-triangle-exclamation", color: "text-white", url: "#" },
            { id: 9, name: "Sublime Text", desc: "一款用于代码、标记和散文的 sophisticated 文本编辑器。", category: "editor", tags: ["Editor", "Fast"], icon: "fa-file-code", color: "text-yellow-400", url: "#" },
            { id: 10, name: "Swagger", desc: "世界上最流行的 API 工具生态系统。", category: "api", tags: ["Documentation", "API"], icon: "fa-book", color: "text-green-400", url: "#" },
            { id: 11, name: "Unsplash", desc: "互联网上最美丽的免费图片库。", category: "design", tags: ["Images", "Free"], icon: "fa-image", color: "text-black", url: "#" },
            { id: 12, name: "Kubernetes", desc: "生产级别的容器编排系统。", category: "deploy", tags: ["Orchestration", "Cloud"], icon: "fa-dharmachakra", color: "text-blue-300", url: "#" }
        ];

        function renderTools(data) {
            const container = document.getElementById('toolList');
            const emptyState = document.getElementById('emptyState');
            container.innerHTML = '';

            if (data.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'glass-card rounded-xl p-5 flex flex-col h-full w-full group cursor-pointer';
                
                const tagsHtml = item.tags.map(tag => `<span class="tool-tag">${tag}</span>`).join('');
                
                card.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div class="w-12 h-12 rounded-lg bg-slate-800/50 flex items-center justify-center border border-white/5 group-hover:border-indigo-500/30 transition-colors">
                            <i class="fa-solid ${item.icon} text-2xl ${item.color}"></i>
                        </div>
                        <a href="${item.url}" target="_blank" class="text-gray-500 hover:text-white transition-colors">
                            <i class="fa-solid fa-arrow-up-right-from-square text-sm"></i>
                        </a>
                    </div>
                    
                    <h3 class="text-lg font-bold text-white mb-2 group-hover:text-indigo-400 transition-colors">${item.name}</h3>
                    <p class="text-gray-400 text-sm mb-4 line-clamp-2 flex-grow leading-relaxed">${item.desc}</p>
                    
                    <div class="flex flex-wrap gap-2 mt-auto pt-4 border-t border-white/5">
                        ${tagsHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = tools.filter(item => 
                item.name.toLowerCase().includes(keyword) || 
                item.desc.toLowerCase().includes(keyword) ||
                item.tags.some(tag => tag.toLowerCase().includes(keyword))
            );
            renderTools(filtered);
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('bg-indigo-600', 'text-white', 'shadow-md', 'shadow-indigo-600/20');
                    b.classList.add('bg-slate-800/50', 'text-gray-400', 'border', 'border-white/5');
                });

                btn.classList.remove('bg-slate-800/50', 'text-gray-400', 'border', 'border-white/5');
                btn.classList.add('bg-indigo-600', 'text-white', 'shadow-md', 'shadow-indigo-600/20');

                const cat = btn.dataset.category;
                renderTools(cat === 'all' ? tools : tools.filter(t => t.category === cat));
            });
        });

        renderTools(tools);
    </script>
</body>
</html>
